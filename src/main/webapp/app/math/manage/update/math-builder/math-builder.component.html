<div class="math-builder">
    <!-- Block palette -->
    <div class="math-builder__palette">
        <span class="math-builder__palette-title" jhiTranslate="artemisApp.mathExercise.builder.palette">Blocks</span>
        @for (block of blocks(); track block.type) {
            <div
                class="math-builder__block"
                [class.math-builder__block--selected]="selectedBlockType() === block.type"
                draggable="true"
                (click)="selectedBlockType.set(block.type)"
                (dragstart)="onBlockDragStart($event, block.type)"
                (dragend)="onBlockDragEnd()"
            >
                {{ block.label }}
            </div>
        }
    </div>

    <!-- Canvas -->
    <div class="math-builder__canvas">
        <div class="math-builder__label">{{ label() }}</div>

        <!-- Expression canvas -->
        <jhi-math-expression-canvas [rootNodes]="rootNodes()" [draggingPayload]="draggingBlockType()" [nodeCtx]="nodeCtx()" [blocks]="blocks()" (gapDrop)="handleGapDrop($event)" />

        <!-- LaTeX preview -->
        @if (rootNodes().length > 0) {
            <div class="math-builder__preview">
                <span [innerHTML]="rootNodes()[0] | mathNodeLatex"></span>
            </div>
        }

        <!-- Keyboard fallback controls -->
        <div class="math-builder__controls">
            @if (isTerminal) {
                <div>
                    <label class="math-builder__value-label" jhiTranslate="artemisApp.mathExercise.builder.value">Value</label>
                    <input pInputText pSize="small" style="width: 80px" [value]="terminalValue()" (input)="terminalValue.set($any($event.target).value)" />
                </div>
            }
            <p-button size="small" [label]="'artemisApp.mathExercise.builder.insert' | artemisTranslate" (onClick)="insertAtSelected()" />
            <p-button
                class="math-builder__clear"
                size="small"
                severity="danger"
                [outlined]="true"
                [label]="'artemisApp.mathExercise.builder.clear' | artemisTranslate"
                (onClick)="clearExpression()"
            />
        </div>

        @if (errorMessage()) {
            <p-message severity="error" [text]="errorMessage()!" styleClass="math-builder__error" />
        }
    </div>
</div>
